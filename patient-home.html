<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">⚕️</span>
                <span class="logo-text">Gojra Doctors</span>
            </div>
            <div class="nav-links">
                <span id="userNameDisplay">Welcome!</span>
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </div>
        </nav>
    </header>

    <main class="dashboard">
        <div class="dashboard-sidebar">
            <div class="sidebar-menu">
                <a href="#" class="sidebar-link active" onclick="showSection('doctors')">🔍 Find Doctors</a>
                <a href="#" class="sidebar-link" onclick="showSection('appointments')">📅 My Appointments</a>
                <a href="#" class="sidebar-link" onclick="showSection('history')">📋 My History</a>
                <a href="#" class="sidebar-link" onclick="showSection('profile')">👤 My Profile</a>
            </div>
        </div>

        <div class="dashboard-content">
            
            <!-- Doctors List -->
            <div id="doctorsSection" class="dashboard-section">
                <h2>Doctors List</h2>
                
                <div class="filter-bar">
                    <select id="specialtyFilter" onchange="filterDoctors()">
                        <option value="">All Specialties</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Ophthalmology">Ophthalmology</option>
                        <option value="General">General Physician</option>
                    </select>
                    <input type="text" id="doctorSearch" placeholder="Search by name..." onkeyup="filterDoctors()">
                </div>

                <div class="doctors-grid" id="doctorsGrid">
                    <p>Loading doctors...</p>
                </div>
            </div>

            <!-- Appointments -->
            <div id="appointmentsSection" class="dashboard-section" style="display: none;">
                <h2>My Appointments</h2>
                <div id="appointmentsList">
                    <p>No appointments found</p>
                </div>
            </div>

            <!-- History -->
            <div id="historySection" class="dashboard-section" style="display: none;">
                <h2>Consultation History</h2>
                <div id="historyList">
                    <p>No records found</p>
                </div>
            </div>

            <!-- Profile -->
            <div id="profileSection" class="dashboard-section" style="display: none;">
                <h2>My Profile</h2>
                <div id="profileInfo">
                    <p>Loading profile...</p>
                </div>
            </div>

        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let allDoctors = [];

        // Check if user is logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'patient-login.html';
                return;
            }
            loadUserData(user);
            loadDoctors();
        });

        function loadUserData(user) {
            db.collection('patients').doc(user.uid).get()
                .then((doc) => {
                    if (doc.exists) {
                        document.getElementById('userNameDisplay').textContent = 'Welcome, ' + doc.data().name;
                    }
                });
        }

        function loadDoctors() {
            db.collection('doctors')
                .where('isApproved', '==', true)
                .get()
                .then((snapshot) => {
                    allDoctors = [];
                    snapshot.forEach(doc => {
                        allDoctors.push({ id: doc.id, ...doc.data() });
                    });
                    displayDoctors(allDoctors);
                })
                .catch((error) => {
                    document.getElementById('doctorsGrid').innerHTML = '<p>Error loading doctors</p>';
                });
        }

        function displayDoctors(doctors) {
            const grid = document.getElementById('doctorsGrid');
            
            if (doctors.length === 0) {
                grid.innerHTML = '<p>No doctors found</p>';
                return;
            }

            grid.innerHTML = doctors.map(doc => `
                <div class="doctor-card">
                    <img src="${doc.photoURL || 'https://via.placeholder.com/150'}" alt="${doc.name}" class="doctor-photo">
                    <h3>${doc.name}</h3>
                    <p class="specialty">${doc.specialty}</p>
                    <p class="qualification">${doc.qualification || ''}</p>
                    <p class="fee">Fee: Rs. ${doc.fee}</p>
                    <p class="experience">Experience: ${doc.experience || 'N/A'} years</p>
                    <button onclick="bookAppointment('${doc.id}', '${doc.name}', ${doc.fee})" class="btn btn-primary btn-full">
                        Book Appointment
                    </button>
                </div>
            `).join('');
        }

        function filterDoctors() {
            const specialty = document.getElementById('specialtyFilter').value;
            const search = document.getElementById('doctorSearch').value.toLowerCase();

            let filtered = allDoctors;

            if (specialty) {
                filtered = filtered.filter(d => d.specialty === specialty);
            }

            if (search) {
                filtered = filtered.filter(d => d.name.toLowerCase().includes(search));
            }

            displayDoctors(filtered);
        }

        function bookAppointment(doctorId, doctorName, fee) {
            const date = prompt('Enter date (YYYY-MM-DD):');
            if (!date) return;
            
            const time = prompt('Enter time (e.g., 10:00 AM):');
            if (!time) return;

            const user = firebase.auth().currentUser;
            if (!user) return;

            db.collection('appointments').add({
                patientId: user.uid,
                doctorId: doctorId,
                doctorName: doctorName,
                fee: fee,
                date: date,
                time: time,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert('Appointment booked successfully!');
                showSection('appointments');
                loadAppointments();
            })
            .catch((error) => {
                alert('Error: ' + error.message);
            });
        }

        function loadAppointments() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            db.collection('appointments')
                .where('patientId', '==', user.uid)
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    const list = document.getElementById('appointmentsList');
                    
                    if (snapshot.empty) {
                        list.innerHTML = '<p>No appointments found</p>';
                        return;
                    }

                    list.innerHTML = snapshot.docs.map(doc => {
                        const data = doc.data();
                        return `
                            <div class="appointment-card">
                                <h4>Doctor: ${data.doctorName}</h4>
                                <p>Date: ${data.date} - Time: ${data.time}</p>
                                <p>Fee: Rs. ${data.fee}</p>
                                <p class="status status-${data.status}">Status: ${data.status}</p>
                                ${data.status === 'confirmed' ? 
                                    `<a href="video-call.html?id=${doc.id}" class="btn btn-primary">Start Video Call</a>` : ''}
                            </div>
                        `;
                    }).join('');
                });
        }

        function showSection(section) {
            document.querySelectorAll('.dashboard-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));

            document.getElementById(section + 'Section').style.display = 'block';
            event.target.classList.add('active');

            if (section === 'appointments') loadAppointments();
            if (section === 'profile') loadProfile();
        }

        function loadProfile() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            db.collection('patients').doc(user.uid).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('profileInfo').innerHTML = `
                            <p><strong>Name:</strong> ${data.name}</p>
                            <p><strong>Phone:</strong> ${data.phone}</p>
                            <p><strong>Age:</strong> ${data.age}</p>
                            <p><strong>Gender:</strong> ${data.gender === 'male' ? 'Male' : data.gender === 'female' ? 'Female' : 'Other'}</p>
                        `;
                    }
                });
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'patient-login.html';
            });
        }
    </script>
</body>
</html>
