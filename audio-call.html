<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Call - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #0d9488;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --white: #ffffff;
            --gray-600: #4b5563;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f766e, #0d9488);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-call-container {
            text-align: center;
            color: var(--white);
            padding: 40px;
        }

        .call-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .doctor-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 4px solid rgba(255,255,255,0.3);
        }

        .doctor-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .call-status {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .call-timer {
            font-size: 36px;
            font-weight: 300;
            margin: 20px 0;
            letter-spacing: 3px;
        }

        .audio-visualizer {
            display: flex;
            gap: 3px;
            justify-content: center;
            align-items: end;
            height: 40px;
            margin: 20px 0;
        }

        .audio-bar {
            width: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 2px;
            animation: audioWave 1s ease-in-out infinite;
        }

        .audio-bar:nth-child(1) { animation-delay: 0s; height: 15px; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; height: 25px; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; height: 35px; }
        .audio-bar:nth-child(4) { animation-delay: 0.3s; height: 25px; }
        .audio-bar:nth-child(5) { animation-delay: 0.4s; height: 15px; }
        .audio-bar:nth-child(6) { animation-delay: 0.5s; height: 30px; }
        .audio-bar:nth-child(7) { animation-delay: 0.6s; height: 20px; }
        .audio-bar:nth-child(8) { animation-delay: 0.7s; height: 10px; }

        @keyframes audioWave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(2); }
        }

        .call-controls {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-top: 30px;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.end-call {
            background: var(--danger);
            width: 75px;
            height: 75px;
            font-size: 32px;
        }

        .control-btn.mute {
            background: rgba(255,255,255,0.2);
        }

        .control-btn.mute.active {
            background: var(--warning);
        }

        .control-btn.speaker {
            background: rgba(255,255,255,0.2);
        }

        .control-btn.speaker.active {
            background: var(--info);
        }

        .control-label {
            font-size: 11px;
            margin-top: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .appointment-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 13px;
        }

        .appointment-info p {
            margin-bottom: 5px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    
    <div class="audio-call-container">
        <div class="call-card">
            
            <!-- Doctor Avatar -->
            <div class="doctor-avatar">👨‍⚕️</div>
            
            <!-- Doctor Name -->
            <div class="doctor-name" id="callDoctorName">Dr. Name</div>
            <div class="call-status" id="callStatus">Connecting...</div>
            
            <!-- Audio Visualizer -->
            <div class="audio-visualizer" id="audioVisualizer">
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
            </div>
            
            <!-- Call Timer -->
            <div class="call-timer" id="callTimer">00:00</div>
            
            <!-- Appointment Info -->
            <div class="appointment-info">
                <p id="appointmentDetails">Loading...</p>
            </div>
            
            <!-- Controls -->
            <div class="call-controls">
                <div class="control-group">
                    <button class="control-btn mute" id="muteBtn" onclick="toggleMute()" title="Mute">
                        🎤
                    </button>
                    <span class="control-label">Mute</span>
                </div>
                
                <div class="control-group">
                    <button class="control-btn end-call" onclick="endCall()" title="End Call">
                        📞
                    </button>
                    <span class="control-label">End</span>
                </div>
                
                <div class="control-group">
                    <button class="control-btn speaker" id="speakerBtn" onclick="toggleSpeaker()" title="Speaker">
                        🔊
                    </button>
                    <span class="control-label">Speaker</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        // ==========================================
        // AUDIO CALL - Gojra Doctors
        // ==========================================
        
        let localStream = null;
        let isMuted = false;
        let isSpeakerOn = false;
        let callStartTime = null;
        let timerInterval = null;
        
        // Get appointment ID from URL
        const params = new URLSearchParams(window.location.search);
        const appointmentId = params.get('id');
        
        // ==================== INITIALIZATION ====================
        
        async function initCall() {
            if (!appointmentId) {
                alert('No appointment ID found!');
                window.location.href = 'doctor-dashboard.html';
                return;
            }
            
            // Get appointment details
            try {
                const doc = await db.collection('appointments').doc(appointmentId).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('callDoctorName').textContent = 'Dr. ' + (data.doctorName || 'Doctor');
                    document.getElementById('appointmentDetails').innerHTML = 
                        '📅 ' + (data.date || 'N/A') + ' | ⏰ ' + (data.time || 'N/A') + 
                        '<br>Patient: ' + (data.patientName || 'Unknown');
                }
            } catch(e) {
                console.error('Error loading appointment:', e);
            }
            
            // Start audio only
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: false,
                    audio: true
                });
                document.getElementById('callStatus').textContent = 'Connected';
                startTimer();
            } catch (error) {
                console.error('Microphone error:', error);
                document.getElementById('callStatus').textContent = 'Microphone access denied';
                document.getElementById('audioVisualizer').style.display = 'none';
                alert('Please allow microphone access for audio call.');
            }
        }
        
        // ==================== MUTE / UNMUTE ====================
        
        function toggleMute() {
            if (!localStream) return;
            
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                
                const btn = document.getElementById('muteBtn');
                if (isMuted) {
                    btn.classList.add('active');
                    btn.textContent = '🔇';
                } else {
                    btn.classList.remove('active');
                    btn.textContent = '🎤';
                }
            }
        }
        
        // ==================== SPEAKER TOGGLE ====================
        
        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const btn = document.getElementById('speakerBtn');
            
            if (isSpeakerOn) {
                btn.classList.add('active');
                btn.textContent = '📢';
            } else {
                btn.classList.remove('active');
                btn.textContent = '🔊';
            }
        }
        
        // ==================== TIMER ====================
        
        function startTimer() {
            callStartTime = Date.now();
            
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('callTimer').textContent = minutes + ':' + seconds;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        // ==================== END CALL ====================
        
        function endCall() {
            if (confirm('End this audio call?')) {
                stopTimer();
                
                // Stop stream
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                
                // Update appointment status
                if (appointmentId) {
                    db.collection('appointments').doc(appointmentId).update({
                        status: 'completed',
                        callType: 'audio',
                        endedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(err => console.error('Update error:', err));
                }
                
                // Go back
                window.location.href = 'doctor-dashboard.html';
            }
        }
        
        // ==================== CLEANUP ====================
        
        window.addEventListener('beforeunload', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            stopTimer();
        });
        
        // Start call on page load
        initCall();
    </script>
</body>
</html>
