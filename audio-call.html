<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Call - Gojra Doctors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #000; height: 100vh; overflow: hidden; }
        
        #jitsi-container { 
            width: 100%; 
            height: calc(100vh - 70px); 
        }
        
        .control-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 1000;
        }
        
        .end-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .info-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            font-size: 14px;
        }
    </style>
</head>
<body>
    
    <div class="info-bar">
        <div>
            <strong id="doctorName">Audio Consultation</strong>
            <br><span style="color: #10b981;" id="statusText">Connecting...</span>
        </div>
    </div>
    
    <div id="jitsi-container"></div>
    
    <div class="control-bar">
        <button class="end-btn" onclick="endCall()">📞 End Call</button>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const appointmentId = params.get('id');
        
        if (!appointmentId) {
            alert('No appointment ID!');
            window.location.href = 'patient-home.html';
        }
        
        const roomName = 'gojra-audio-' + appointmentId;
        
        db.collection('appointments').doc(appointmentId).get()
            .then(function(doc) {
                if (doc.exists) {
                    document.getElementById('doctorName').textContent = 
                        'Audio: Dr. ' + (doc.data().doctorName || 'Doctor');
                }
            });
        
        const domain = 'meet.jit.si';
        const options = {
            roomName: roomName,
            width: '100%',
            height: '100%',
            parentNode: document.getElementById('jitsi-container'),
            userInfo: { displayName: 'User' },
            interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                TOOLBAR_BUTTONS: ['microphone', 'hangup', 'chat', 'settings'],
                TOOLBAR_ALWAYS_VISIBLE: true,
            },
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: true,
                disableDeepLinking: true,
            }
        };
        
        const api = new JitsiMeetExternalAPI(domain, options);
        
        api.addEventListeners({
            videoConferenceJoined: function() {
                document.getElementById('statusText').textContent = '✅ Audio Connected';
                api.executeCommand('toggleVideo');
            },
            participantJoined: function() {
                document.getElementById('statusText').textContent = '✅ Both connected!';
            }
        });
        
        function endCall() {
            if (confirm('End this audio call?')) {
                if (appointmentId) {
                    db.collection('appointments').doc(appointmentId).update({
                        status: 'completed',
                        callType: 'audio',
                        endedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(function() {
                        api.dispose();
                        window.location.href = 'patient-home.html';
                    });
                }
            }
        }
    </script>
</body>
</html>
