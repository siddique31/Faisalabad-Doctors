<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-btn">← Back</a>
                <div class="auth-logo">⚕️</div>
                <h2>Patient Login</h2>
                <p>Enter your phone number</p>
            </div>

            <!-- Step 1: Phone Number -->
            <div id="phoneStep" class="auth-form">
                <div class="input-group">
                    <label>Phone Number</label>
                    <div class="phone-input">
                        <span class="country-code">+92</span>
                        <input type="tel" id="phoneNumber" placeholder="3XX-XXXXXXX" maxlength="10">
                    </div>
                </div>
                <button onclick="sendOTP()" class="btn btn-primary btn-full" id="sendOtpBtn">
                    Get OTP
                </button>
                <p class="auth-note">A new account will be created if not already registered</p>
            </div>

            <!-- Step 2: OTP -->
            <div id="otpStep" class="auth-form" style="display: none;">
                <p class="otp-sent-to">OTP sent to: <span id="sentTo"></span></p>
                <div class="input-group">
                    <label>OTP Code</label>
                    <input type="text" id="otpCode" placeholder="------" maxlength="6" class="otp-input">
                </div>
                <button onclick="verifyOTP()" class="btn btn-primary btn-full" id="verifyOtpBtn">
                    Verify
                </button>
                <button onclick="goBackToPhone()" class="btn btn-outline btn-full" style="margin-top: 10px;">
                    Change Number
                </button>
            </div>

            <!-- Step 3: Registration (New Patient) -->
            <div id="registerStep" class="auth-form" style="display: none;">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Age" min="1" max="120">
                </div>
                <div class="input-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button onclick="completeRegistration()" class="btn btn-primary btn-full">
                    Complete Registration
                </button>
            </div>

            <div id="messageBox" class="message-box" style="display: none;"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script>
        let currentVerificationId = '';
        let currentPhoneNumber = '';

        function showMessage(msg, type = 'info') {
            const box = document.getElementById('messageBox');
            box.style.display = 'block';
            box.textContent = msg;
            box.className = 'message-box ' + type;
            setTimeout(() => box.style.display = 'none', 5000);
        }

        function sendOTP() {
            const phone = document.getElementById('phoneNumber').value.trim();
            
            if (phone.length < 10) {
                showMessage('Please enter a valid phone number', 'error');
                return;
            }

            currentPhoneNumber = '+92' + phone;
            document.getElementById('sentTo').textContent = currentPhoneNumber;
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';

            // Firebase send OTP
            firebase.auth().signInWithPhoneNumber(currentPhoneNumber, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    currentVerificationId = confirmationResult.verificationId;
                    document.getElementById('phoneStep').style.display = 'none';
                    document.getElementById('otpStep').style.display = 'block';
                    showMessage('OTP sent successfully!', 'success');
                })
                .catch((error) => {
                    showMessage('Error: ' + error.message, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Get OTP';
                });
        }

        function verifyOTP() {
            const otp = document.getElementById('otpCode').value.trim();
            
            if (otp.length !== 6) {
                showMessage('Please enter the 6-digit OTP', 'error');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            const credential = firebase.auth.PhoneAuthProvider.credential(currentVerificationId, otp);
            
            firebase.auth().signInWithCredential(credential)
                .then((result) => {
                    const user = result.user;
                    // Check if user exists
                    return db.collection('patients').doc(user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists) {
                        // Existing user - go to home
                        showMessage('Login successful!', 'success');
                        setTimeout(() => window.location.href = 'patient-home.html', 1000);
                    } else {
                        // New user - show registration
                        document.getElementById('otpStep').style.display = 'none';
                        document.getElementById('registerStep').style.display = 'block';
                    }
                })
                .catch((error) => {
                    showMessage('Invalid OTP: ' + error.message, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Verify';
                });
        }

        function completeRegistration() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            const name = document.getElementById('fullName').value.trim();
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            if (!name || !age || !gender) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            db.collection('patients').doc(user.uid).set({
                name: name,
                phone: currentPhoneNumber,
                age: parseInt(age),
                gender: gender,
                email: user.email || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                showMessage('Registration successful! Redirecting to home...', 'success');
                setTimeout(() => window.location.href = 'patient-home.html', 1500);
            })
            .catch((error) => {
                showMessage('Error: ' + error.message, 'error');
            });
        }

        function goBackToPhone() {
            document.getElementById('otpStep').style.display = 'none';
            document.getElementById('phoneStep').style.display = 'block';
        }

        // reCAPTCHA
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendOtpBtn', {
            'size': 'invisible',
            'callback': () => {}
        });
    </script>
</body>
</html>
