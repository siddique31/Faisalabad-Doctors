<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Call - Gojra Doctors</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; background: #000; }
        #jitsi { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="jitsi"></div>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const domain = 'meet.jit.si';
        const options = {
            roomName: 'GojraTestRoom789',
            width: '100%',
            height: '100%',
            parentNode: document.getElementById('jitsi'),
            userInfo: {
                displayName: 'User'
            },
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                prejoinPageEnabled: false,
                requireDisplayName: false,
            },
            interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                SHOW_WATERMARK_FOR_GUESTS: false,
                TOOLBAR_BUTTONS: ['microphone', 'camera', 'hangup', 'chat'],
                DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
            }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
        console.log('✅ Jitsi loaded!');
    </script>
</body>
</html>
