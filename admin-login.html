<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🛡️</div>
                <h2>Admin Login</h2>
                <p>Authorized personnel only</p>
            </div>

            <div class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@gojradoctors.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button onclick="adminLogin()" class="btn btn-primary btn-full">
                    Login
                </button>
            </div>

            <div id="messageBox" class="message-box" style="display: none;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        function showMessage(msg, type = 'info') {
            const box = document.getElementById('messageBox');
            box.style.display = 'block';
            box.textContent = msg;
            box.className = 'message-box ' + type;
        }

        function adminLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((result) => {
                    return db.collection('admins').doc(result.user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists) {
                        showMessage('Login successful!', 'success');
                        setTimeout(() => window.location.href = 'admin-dashboard.html', 1000);
                    } else {
                        showMessage('You are not an admin', 'error');
                        firebase.auth().signOut();
                    }
                })
                .catch((error) => {
                    showMessage('Invalid email or password', 'error');
                });
        }
    </script>
</body>
</html>
