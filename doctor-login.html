<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-btn">← Back</a>
                <div class="auth-logo">👨‍⚕️</div>
                <h2>Doctor Login / Registration</h2>
                <p>Welcome to Gojra Doctors</p>
            </div>

            <!-- Login Form -->
            <div id="loginStep" class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <button onclick="loginDoctor()" class="btn btn-primary btn-full" id="loginBtn">
                    Login
                </button>
                <p style="text-align: center; margin-top: 15px;">
                    New doctor? 
                    <a href="#" onclick="showRegister()" style="color: var(--primary);">Register Here</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerStep" class="auth-form" style="display: none;">
                <h3 style="text-align: center; margin-bottom: 20px;">Doctor Registration</h3>
                
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Dr. Name">
                </div>
                <div class="input-group">
                    <label>Email *</label>
                    <input type="email" id="regEmail" placeholder="your@email.com">
                </div>
                <div class="input-group">
                    <label>Password *</label>
                    <input type="password" id="regPassword" placeholder="Min 6 characters" minlength="6">
                </div>
                <div class="input-group">
                    <label>Specialty *</label>
                    <select id="specialty">
                        <option value="">Select</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Ophthalmology">Ophthalmology</option>
                        <option value="General">General Physician</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Qualification *</label>
                    <input type="text" id="qualification" placeholder="e.g., MBBS, FCPS">
                </div>
                <div class="input-group">
                    <label>PMDC Number *</label>
                    <input type="text" id="pmdcNumber" placeholder="PMDC-XXXXX">
                </div>
                <div class="input-group">
                    <label>Experience (Years)</label>
                    <input type="number" id="experience" placeholder="e.g., 10">
                </div>
                <div class="input-group">
                    <label>CNIC *</label>
                    <input type="text" id="cnic" placeholder="XXXXX-XXXXXXX-X">
                </div>
                <div class="input-group">
                    <label>Consultation Fee (Rs.) *</label>
                    <input type="number" id="fee" placeholder="e.g., 500" min="100">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="03XX-XXXXXXX">
                </div>
                <button onclick="registerDoctor()" class="btn btn-primary btn-full">
                    Submit Registration
                </button>
                <p style="text-align: center; margin-top: 10px; font-size: 12px; color: #666;">
                    * Admin will verify your information before activation
                </p>
                <p style="text-align: center; margin-top: 10px;">
                    Already registered? 
                    <a href="#" onclick="showLogin()" style="color: var(--primary);">Login Here</a>
                </p>
            </div>

            <div id="messageBox" class="message-box" style="display: none;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        function showMessage(msg, type = 'info') {
            const box = document.getElementById('messageBox');
            box.style.display = 'block';
            box.textContent = msg;
            box.className = 'message-box ' + type;
            setTimeout(() => box.style.display = 'none', 5000);
        }

        function showRegister() {
            document.getElementById('loginStep').style.display = 'none';
            document.getElementById('registerStep').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('registerStep').style.display = 'none';
            document.getElementById('loginStep').style.display = 'block';
        }

        function loginDoctor() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((result) => {
                    const user = result.user;
                    return db.collection('doctors').doc(user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists && doc.data().isApproved) {
                        showMessage('Login successful!', 'success');
                        setTimeout(() => window.location.href = 'doctor-dashboard.html', 1000);
                    } else if (doc.exists && !doc.data().isApproved) {
                        showMessage('Your account is pending approval.', 'warning');
                    } else {
                        showMessage('Doctor profile not found. Please register.', 'error');
                        firebase.auth().signOut();
                    }
                })
                .catch((error) => {
                    let msg = 'Login failed!';
                    if (error.code === 'auth/user-not-found') msg = 'No account found. Please register.';
                    else if (error.code === 'auth/wrong-password') msg = 'Incorrect password!';
                    showMessage(msg, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Login';
                });
        }

        function registerDoctor() {
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const specialty = document.getElementById('specialty').value;
            const qualification = document.getElementById('qualification').value.trim();
            const pmdcNumber = document.getElementById('pmdcNumber').value.trim();
            const experience = document.getElementById('experience').value;
            const cnic = document.getElementById('cnic').value.trim();
            const fee = document.getElementById('fee').value;
            const phone = document.getElementById('phone').value.trim();

            if (!name || !email || !password || !specialty || !qualification || !pmdcNumber || !cnic || !fee) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then((result) => {
                    const user = result.user;
                    return db.collection('doctors').doc(user.uid).set({
                        name: name,
                        email: email,
                        specialty: specialty,
                        qualification: qualification,
                        pmdcNumber: pmdcNumber,
                        experience: experience,
                        cnic: cnic,
                        fee: parseInt(fee),
                        phone: phone,
                        photoURL: '',
                        isApproved: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    showMessage('Registration submitted! Waiting for admin approval.', 'success');
                    setTimeout(() => window.location.href = 'doctor-dashboard.html', 2000);
                })
                .catch((error) => {
                    let msg = 'Registration failed!';
                    if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered!';
                    showMessage(msg, 'error');
                });
        }
    </script>
</body>
</html>
