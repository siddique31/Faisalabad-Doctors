<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Gojra Doctors</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-btn">← Back</a>
                <div class="auth-logo">👨‍⚕️</div>
                <h2>Doctor Login / Registration</h2>
                <p>Welcome to Gojra Doctors</p>
            </div>

            <!-- Step 1: Phone Number -->
            <div id="phoneStep" class="auth-form">
                <div class="input-group">
                    <label>Phone Number</label>
                    <div class="phone-input">
                        <span class="country-code">+92</span>
                        <input type="tel" id="phoneNumber" placeholder="3XX-XXXXXXX" maxlength="10">
                    </div>
                </div>
                <button onclick="sendOTP()" class="btn btn-primary btn-full" id="sendOtpBtn">
                    Get OTP
                </button>
            </div>

            <!-- Step 2: OTP -->
            <div id="otpStep" class="auth-form" style="display: none;">
                <div class="input-group">
                    <label>OTP Code</label>
                    <input type="text" id="otpCode" placeholder="------" maxlength="6" class="otp-input">
                </div>
                <button onclick="verifyOTP()" class="btn btn-primary btn-full">Verify</button>
            </div>

            <!-- Step 3: Doctor Registration -->
            <div id="registerStep" class="auth-form" style="display: none;">
                <h3 style="text-align: center; margin-bottom: 20px;">Doctor Information</h3>
                
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Doctor's name">
                </div>
                
                <div class="input-group">
                    <label>Specialty *</label>
                    <select id="specialty">
                        <option value="">Select</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Ophthalmology">Ophthalmology</option>
                        <option value="General">General Physician</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Dentistry">Dentistry</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Qualification *</label>
                    <input type="text" id="qualification" placeholder="e.g., MBBS, FCPS">
                </div>
                
                <div class="input-group">
                    <label>PMDC Registration Number *</label>
                    <input type="text" id="pmdcNumber" placeholder="PMDC-XXXXX">
                </div>
                
                <div class="input-group">
                    <label>Experience (Years)</label>
                    <input type="number" id="experience" placeholder="e.g., 10" min="0">
                </div>
                
                <div class="input-group">
                    <label>CNIC Number *</label>
                    <input type="text" id="cnic" placeholder="XXXXX-XXXXXXX-X">
                </div>
                
                <div class="input-group">
                    <label>Consultation Fee (Rs.) *</label>
                    <input type="number" id="fee" placeholder="e.g., 500" min="100">
                </div>
                
                <div class="input-group">
                    <label>Profile Photo URL</label>
                    <input type="url" id="photoURL" placeholder="https://example.com/photo.jpg">
                </div>
                
                <button onclick="completeDoctorRegistration()" class="btn btn-primary btn-full">
                    Submit Registration
                </button>
                <p style="text-align: center; margin-top: 10px; font-size: 12px; color: #666;">
                    * Admin will verify your information before activation
                </p>
            </div>

            <div id="messageBox" class="message-box" style="display: none;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let currentVerificationId = '';
        let currentPhoneNumber = '';

        function showMessage(msg, type = 'info') {
            const box = document.getElementById('messageBox');
            box.style.display = 'block';
            box.textContent = msg;
            box.className = 'message-box ' + type;
            setTimeout(() => box.style.display = 'none', 5000);
        }

        function sendOTP() {
            const phone = document.getElementById('phoneNumber').value.trim();
            if (phone.length < 10) {
                showMessage('Please enter a valid phone number', 'error');
                return;
            }
            currentPhoneNumber = '+92' + phone;
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';

            firebase.auth().signInWithPhoneNumber(currentPhoneNumber, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    currentVerificationId = confirmationResult.verificationId;
                    document.getElementById('phoneStep').style.display = 'none';
                    document.getElementById('otpStep').style.display = 'block';
                    showMessage('OTP sent successfully!', 'success');
                })
                .catch((error) => {
                    showMessage('Error: ' + error.message, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Get OTP';
                });
        }

        function verifyOTP() {
            const otp = document.getElementById('otpCode').value.trim();
            if (otp.length !== 6) {
                showMessage('Please enter the 6-digit OTP', 'error');
                return;
            }

            const credential = firebase.auth.PhoneAuthProvider.credential(currentVerificationId, otp);
            
            firebase.auth().signInWithCredential(credential)
                .then((result) => {
                    const user = result.user;
                    return db.collection('doctors').doc(user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists && doc.data().isApproved) {
                        showMessage('Login successful! Redirecting to dashboard...', 'success');
                        setTimeout(() => window.location.href = 'doctor-dashboard.html', 1000);
                    } else if (doc.exists && !doc.data().isApproved) {
                        showMessage('Your account is pending approval. Please wait.', 'warning');
                    } else {
                        document.getElementById('otpStep').style.display = 'none';
                        document.getElementById('registerStep').style.display = 'block';
                    }
                })
                .catch((error) => {
                    showMessage('Error: ' + error.message, 'error');
                });
        }

        function completeDoctorRegistration() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            const data = {
                name: document.getElementById('fullName').value.trim(),
                specialty: document.getElementById('specialty').value,
                qualification: document.getElementById('qualification').value.trim(),
                pmdcNumber: document.getElementById('pmdcNumber').value.trim(),
                experience: document.getElementById('experience').value,
                cnic: document.getElementById('cnic').value.trim(),
                fee: parseInt(document.getElementById('fee').value),
                photoURL: document.getElementById('photoURL').value.trim(),
                phone: currentPhoneNumber,
                isApproved: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (!data.name || !data.specialty || !data.qualification || !data.pmdcNumber || !data.cnic || !data.fee) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            db.collection('doctors').doc(user.uid).set(data)
                .then(() => {
                    showMessage('Registration successful! Admin will verify your information.', 'success');
                    setTimeout(() => window.location.href = 'doctor-dashboard.html', 2000);
                })
                .catch((error) => {
                    showMessage('Error: ' + error.message, 'error');
                });
        }

        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendOtpBtn', {
            'size': 'invisible',
            'callback': () => {}
        });
    </script>
</body>
</html>
